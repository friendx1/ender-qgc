# Parameter für Birks pointcloud_compressor_node, nur für die Hindernis-Karte (SUPER inflate map).
# Gröberes Raster und 1 Hz, damit die Karte über den Funk passt.
#
# Start (Kompressor allein, ohne Birks Launch-File):
#   Diese Datei wurde in der Sim von Birks Node mit "unknown ROS arguments" abgelehnt (--params-file).
#   Was funktioniert, steht in ENDER.md (Abschnitt Hindernis-Karte): dieselben Werte per -p.
/**:
  ros__parameters:
    compression_level: 3
    topic_keys:
      - "rog_map_inf_occ"
    rog_map_inf_occ:
      input_topic: "/rog_map/inf_occ"
      downsample_leaf_size: 0.4   # Meter, 0.0 = aus
      max_frequency_hz: 1.0
